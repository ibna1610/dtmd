<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DTMD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #060010; overflow: hidden; touch-action: none; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Setup ─────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var ctx    = canvas.getContext('2d');

function getW() { return window.innerWidth  || screen.width  || 375; }
function getH() { return window.innerHeight || screen.height || 667; }

function resize() {
  var w = getW(), h = getH();
  canvas.width  = w;
  canvas.height = h;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
}

// ── Heart math ────────────────────────────────────────────────
function heartXY(t) {
  return {
    x:  160 * Math.pow(Math.sin(t), 3),
    y: -(130 * Math.cos(t) - 50 * Math.cos(2*t) - 20 * Math.cos(3*t) - 10 * Math.cos(4*t))
  };
}

function buildHeartPath(cx, cy, scale) {
  ctx.beginPath();
  for (var i = 0; i <= 200; i++) {
    var t = -Math.PI + (i / 200) * Math.PI * 2;
    var p = heartXY(t);
    var x = cx + p.x * scale;
    var y = cy + p.y * scale;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// ── 2D Particles ──────────────────────────────────────────────
var PCOLORS = ['#ff6eb4','#ff9de2','#ff4d94','#c850c0','#ff85e1','#ffffff','#b44fff','#ffb3ec','#ff80c0'];

function Particle() { this.reset(true); }
Particle.prototype.reset = function(init) {
  var t  = Math.random() * Math.PI * 2 - Math.PI;
  var p  = heartXY(t);
  var cx = canvas.width  / 2;
  var cy = canvas.height / 2;
  var sc = Math.min(canvas.width, canvas.height) / 520;
  this.x = cx + p.x * sc;
  this.y = cy + p.y * sc;
  var speed = 0.3 + Math.random() * 1.1;
  var angle = Math.random() * Math.PI * 2;
  this.vx = Math.cos(angle) * speed;
  this.vy = Math.sin(angle) * speed - 0.5;
  this.alpha    = init ? Math.random() : 0;
  this.maxAlpha = 0.5 + Math.random() * 0.5;
  this.life     = init ? Math.floor(Math.random() * 120) : 0;
  this.maxLife  = 80 + Math.random() * 110;
  this.size     = 1.2 + Math.random() * 2.8;
  this.color    = PCOLORS[Math.floor(Math.random() * PCOLORS.length)];
  this.twinkle  = Math.random() * Math.PI * 2;
  this.twSpd    = 0.05 + Math.random() * 0.09;
  this.isStar   = Math.random() < 0.2;
};
Particle.prototype.update = function() {
  this.life++;
  this.x += this.vx;
  this.y += this.vy;
  this.vy -= 0.007;
  this.twinkle += this.twSpd;
  var p = this.life / this.maxLife;
  if      (p < 0.2) this.alpha = this.maxAlpha * (p / 0.2);
  else if (p > 0.7) this.alpha = this.maxAlpha * (1 - (p - 0.7) / 0.3);
  else              this.alpha = this.maxAlpha;
  if (this.life >= this.maxLife) this.reset(false);
};
Particle.prototype.draw = function() {
  var flicker = 0.6 + 0.4 * Math.sin(this.twinkle);
  ctx.globalAlpha = this.alpha * flicker;
  if (this.isStar) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.beginPath();
    for (var i = 0; i < 4; i++) {
      var a = (i / 4) * Math.PI * 2;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * this.size * 1.8, Math.sin(a) * this.size * 1.8);
    }
    ctx.strokeStyle = this.color;
    ctx.lineWidth   = 1.0;
    ctx.stroke();
    ctx.restore();
  } else {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
};

// ── 3D Heart surface ──────────────────────────────────────────
function heartSurface3D(t, s) {
  var sinT = Math.sin(t);
  var x =  16 * sinT * sinT * sinT;
  var y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  var z =   8 * Math.cos(s) * (1 - Math.abs(t) / Math.PI * 0.55);
  return { x: x, y: y, z: z };
}

var MCOLORS = [
  [255,80,160],[255,140,200],[255,55,130],
  [220,50,170],[195,85,255],[255,185,225],
  [255,255,255],[165,45,235],[255,105,190]
];

function Molecule(idx) {
  this.idx       = idx;
  this.color     = MCOLORS[Math.floor(Math.random() * MCOLORS.length)];
  this.size      = 1.2 + Math.random() * 1.8;
  this.phase     = Math.random() * Math.PI * 2;
  this.floatAmp  = 0.5 + Math.random() * 1.2;
  this.floatFreq = 0.2 + Math.random() * 0.55;
  this.orbitAmp  = 0.35 + Math.random() * 0.8;
  this.orbitFreq = 0.15 + Math.random() * 0.4;
  this.twinkle   = Math.random() * Math.PI * 2;
  this.twSpd     = 0.03 + Math.random() * 0.05;
  this.spinAngle = Math.random() * Math.PI * 2;
  this.spinSpeed = (Math.random() - 0.5) * 0.035;
}
Molecule.prototype.getPos = function(time) {
  var b = basePoints[this.idx];
  var breathe = Math.sin(time * this.floatFreq + this.phase) * this.floatAmp;
  var ox = Math.cos(time * this.orbitFreq + this.phase) * this.orbitAmp;
  var oy = Math.sin(time * this.orbitFreq * 1.3 + this.phase) * this.orbitAmp * 0.5;
  var oz = Math.sin(time * this.orbitFreq * 0.8 + this.phase) * this.orbitAmp;
  var len = Math.sqrt(b.bx*b.bx + b.by*b.by + b.bz*b.bz) || 1;
  return {
    x: b.bx + (b.bx/len)*breathe + ox,
    y: b.by + (b.by/len)*breathe + oy,
    z: b.bz + (b.bz/len)*breathe + oz
  };
};

function drawTinyHeart(cx, cy, size, r, g, b, alpha, angle) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.scale(size, size);
  ctx.beginPath();
  ctx.moveTo(0, 0.35);
  ctx.bezierCurveTo( 0,   0.1, -0.5,-0.3,-0.5,-0.05);
  ctx.bezierCurveTo(-0.5,-0.4,  0,  -0.4,  0, -0.1);
  ctx.bezierCurveTo( 0,  -0.4,  0.5,-0.4, 0.5,-0.05);
  ctx.bezierCurveTo( 0.5,-0.3,  0,   0.1,  0,  0.35);
  ctx.closePath();
  ctx.fillStyle = 'rgb('+r+','+g+','+b+')';
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = alpha * 0.2;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 2.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb('+r+','+g+','+b+')';
  ctx.fill();
  ctx.globalAlpha = 1;
}

// 3D helpers
function rotY(p, a) {
  return { x: p.x*Math.cos(a)+p.z*Math.sin(a), y: p.y, z: -p.x*Math.sin(a)+p.z*Math.cos(a) };
}
function rotX(p, a) {
  return { x: p.x, y: p.y*Math.cos(a)-p.z*Math.sin(a), z: p.y*Math.sin(a)+p.z*Math.cos(a) };
}
function project(p, cx, cy, scale, fov) {
  var z = p.z + fov;
  var f = fov / z;
  return { sx: cx + p.x*scale*f, sy: cy + p.y*scale*f, f: f };
}

// Input handling
var isDragging=false, dragStartX=0, dragStartY=0;
var manualRotY=0, manualRotX=0.28, targetRotY=0, targetRotX=0.28;
var mouseX=0, mouseY=0;

canvas.addEventListener('mousedown', function(e){ isDragging=true; dragStartX=e.clientX; dragStartY=e.clientY; });
canvas.addEventListener('mousemove', function(e){
  if(isDragging){
    targetRotY+=(e.clientX-dragStartX)*0.005; targetRotX+=(e.clientY-dragStartY)*0.005;
    dragStartX=e.clientX; dragStartY=e.clientY;
  }
  mouseX=(e.clientX/canvas.width-0.5)*2;
  mouseY=(e.clientY/canvas.height-0.5)*2;
});
canvas.addEventListener('mouseup',    function(){ isDragging=false; });
canvas.addEventListener('mouseleave', function(){ isDragging=false; });
canvas.addEventListener('touchstart', function(e){ e.preventDefault(); isDragging=true; dragStartX=e.touches[0].clientX; dragStartY=e.touches[0].clientY; }, {passive:false});
canvas.addEventListener('touchmove',  function(e){ e.preventDefault();
  if(isDragging){
    targetRotY+=(e.touches[0].clientX-dragStartX)*0.005; targetRotX+=(e.touches[0].clientY-dragStartY)*0.005;
    dragStartX=e.touches[0].clientX; dragStartY=e.touches[0].clientY;
  }
}, {passive:false});
canvas.addEventListener('touchend', function(){ isDragging=false; });

// ── State ─────────────────────────────────────────────────────
var isMobile = getW() < 768;
var PCOUNT   = isMobile ? 200 : 700;
var MCOUNT   = isMobile ? 600 : 1800;
var particles  = [];
var basePoints = [];
var molecules  = [];

function initAll() {
  resize();

  particles = [];
  for (var i = 0; i < PCOUNT; i++) particles.push(new Particle());

  basePoints = [];
  for (var i = 0; i < MCOUNT; i++) {
    var t = -Math.PI + Math.random() * Math.PI * 2;
    var s = -Math.PI + Math.random() * Math.PI * 2;
    var p = heartSurface3D(t, s);
    basePoints.push({
      bx: p.x + (Math.random()-0.5)*0.22,
      by: p.y + (Math.random()-0.5)*0.22,
      bz: p.z + (Math.random()-0.5)*0.22
    });
  }

  molecules = [];
  for (var i = 0; i < MCOUNT; i++) molecules.push(new Molecule(i));
}

// ── Main loop ─────────────────────────────────────────────────
var time=0, autoRotY=0, lastTs=0;

function render(ts) {
  requestAnimationFrame(render);

  var dt = ts - lastTs;
  lastTs = ts;
  // clamp delta để tránh jump khi tab bị ẩn
  if (dt > 100 || dt <= 0) dt = 16;
  time += dt * 0.001;

  if (!isDragging) autoRotY += 0.004;
  manualRotY += (targetRotY - manualRotY) * 0.08;
  manualRotX += (targetRotX - manualRotX) * 0.08;

  var rY    = autoRotY + manualRotY + mouseX * 0.2;
  var rX    = manualRotX + mouseY * 0.1;
  var cx    = canvas.width  / 2;
  var cy    = canvas.height / 2 + 10;
  var pulse = 1 + 0.05 * Math.sin(time * 2.1);
  var sc2d  = Math.min(canvas.width, canvas.height) / 520 * pulse;
  var sc3d  = Math.min(canvas.width, canvas.height) / 38;
  var fov   = 280;

  // nền
  ctx.fillStyle = '#060010';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // ── Glow layers (không dùng shadowBlur — quá nặng trên iOS) ──
  var glowColors = ['rgba(255,110,180,0.12)','rgba(200,80,192,0.08)','rgba(123,47,247,0.05)'];
  for (var layer = 1; layer <= 3; layer++) {
    buildHeartPath(cx, cy, sc2d * (1 + layer * 0.06));
    ctx.strokeStyle = glowColors[layer-1];
    ctx.lineWidth   = 4 + layer * 3;
    ctx.stroke();
  }

  // ── Filled heart ──
  buildHeartPath(cx, cy, sc2d);
  ctx.fillStyle = 'rgba(215,55,155,0.10)';
  ctx.fill();

  // ── Outline ──
  buildHeartPath(cx, cy, sc2d);
  ctx.strokeStyle = '#ff4d94';
  ctx.lineWidth   = 2.2;
  ctx.stroke();

  // ── Particles ──
  for (var i = 0; i < particles.length; i++) {
    particles[i].update();
    particles[i].draw();
  }

  // ── 3D molecules ──
  var projected = [];
  for (var i = 0; i < molecules.length; i++) {
    var mol = molecules[i];
    var wp  = mol.getPos(time);
    var p   = { x: wp.x*pulse, y: wp.y*pulse, z: wp.z*pulse };
    p = rotY(p, rY);
    p = rotX(p, rX);
    var proj = project(p, cx, cy, sc3d, fov);
    projected.push({ mol: mol, proj: proj, z: p.z });
  }
  projected.sort(function(a,b){ return a.z - b.z; });

  for (var i = 0; i < projected.length; i++) {
    var item  = projected[i];
    var sx    = item.proj.sx, sy = item.proj.sy, f = item.proj.f;
    var depth = Math.max(0, Math.min(1, (f - 0.28) / 1.5));
    var mol   = item.mol;
    mol.twinkle   += mol.twSpd;
    mol.spinAngle += mol.spinSpeed;
    var flicker   = 0.5 + 0.5 * Math.sin(mol.twinkle);
    var alpha     = depth * flicker * 0.9;
    var heartSize = mol.size * f * sc3d * 0.26;
    if (heartSize < 0.5 || alpha < 0.03) continue;
    var c = mol.color;
    drawTinyHeart(sx, sy, heartSize, c[0], c[1], c[2], alpha, mol.spinAngle);
  }
}

// ── Start ─────────────────────────────────────────────────────
window.addEventListener('resize', function() {
  resize();
  particles = [];
  for (var i = 0; i < PCOUNT; i++) particles.push(new Particle());
});

window.addEventListener('load', function() {
  initAll();
  requestAnimationFrame(render);
});

// fallback nếu load đã fired
if (document.readyState === 'complete') {
  initAll();
  requestAnimationFrame(render);
}
</script>
</body>
</html>
